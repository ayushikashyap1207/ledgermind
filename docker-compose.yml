services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledgermind
      POSTGRES_PASSWORD: ledgermind
      POSTGRES_DB: ledgermind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-readonly-role.sql:/docker-entrypoint-initdb.d/init-readonly-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgermind"]
      interval: 5s
      timeout: 3s
      retries: 10

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chromadata:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://ledgermind:ledgermind@postgres:5432/ledgermind
      DATABASE_READONLY_URL: postgresql+psycopg2://ledgermind_ro:ledgermind_ro@postgres:5432/ledgermind
      CHROMA_PERSIST_DIR: /chroma_data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_healthy

volumes:
  pgdata:
  chromadata:
